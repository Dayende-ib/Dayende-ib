<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="From interface to production: client, API, data, infrastructure on VPS" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#30363D"/>
      <stop offset="100%" stop-color="#484F58"/>
    </linearGradient>
    <pattern id="g2" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0 L0 0 0 22" fill="none" stroke="#1B2027" stroke-width="1"/>
    </pattern>
    <clipPath id="cc"><rect x="1" y="1" width="878" height="468" rx="16"/></clipPath>
  </defs>

  <rect x="1" y="1" width="878" height="468" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <g clip-path="url(#cc)"><rect x="1" y="1" width="878" height="468" fill="url(#g2)" opacity="0.6"/></g>

  <text x="40" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#6E7681">
    <tspan fill="#34D399">$</tspan> <tspan>traceroute idea → production</tspan>
  </text>

  <!-- connectors -->
  <g stroke="url(#line)" stroke-width="1.5">
    <path d="M260 146 V178 M440 146 V178 M620 146 V178"/>
    <path d="M260 254 V286 M440 254 V286 M620 254 V286"/>
    <path d="M260 362 V394 M440 362 V394 M620 362 V394"/>
  </g>

  <g>
    <circle cx="260" r="3.5" fill="#6EE7F9"><animate attributeName="cy" values="146;178" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="440" r="3.5" fill="#6EE7F9"><animate attributeName="cy" values="146;178" dur="1.6s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="620" r="3.5" fill="#6EE7F9"><animate attributeName="cy" values="146;178" dur="1.6s" begin="1s" repeatCount="indefinite"/></circle>

    <circle cx="260" r="3.5" fill="#A78BFA"><animate attributeName="cy" values="254;286" dur="1.6s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="440" r="3.5" fill="#A78BFA"><animate attributeName="cy" values="254;286" dur="1.6s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="620" r="3.5" fill="#A78BFA"><animate attributeName="cy" values="254;286" dur="1.6s" begin="1.4s" repeatCount="indefinite"/></circle>

    <circle cx="260" r="3.5" fill="#34D399"><animate attributeName="cy" values="362;394" dur="1.6s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="440" r="3.5" fill="#34D399"><animate attributeName="cy" values="362;394" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="620" r="3.5" fill="#34D399"><animate attributeName="cy" values="362;394" dur="1.6s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- layer 1 : client -->
  <g>
    <rect x="70" y="70" width="740" height="76" rx="12" fill="#161B22" stroke="#30363D"/>
    <rect x="70" y="70" width="5" height="76" rx="2.5" fill="#6EE7F9"/>
    <text x="96" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#6EE7F9">CLIENT</text>
    <text x="96" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#C9D1D9">Next.js · React · Vue · Flutter · TailwindCSS</text>
    <text x="786" y="112" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#21262D">01</text>
  </g>

  <!-- layer 2 : api -->
  <g>
    <rect x="70" y="178" width="740" height="76" rx="12" fill="#161B22" stroke="#30363D"/>
    <rect x="70" y="178" width="5" height="76" rx="2.5" fill="#A78BFA"/>
    <text x="96" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#A78BFA">API &amp; SERVICES</text>
    <text x="96" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#C9D1D9">NestJS · Express · Laravel · REST / WebSocket · LLM &amp; agents</text>
    <text x="786" y="220" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#21262D">02</text>
  </g>

  <!-- layer 3 : data -->
  <g>
    <rect x="70" y="286" width="740" height="76" rx="12" fill="#161B22" stroke="#30363D"/>
    <rect x="70" y="286" width="5" height="76" rx="2.5" fill="#34D399"/>
    <text x="96" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#34D399">DATA &amp; JOBS</text>
    <text x="96" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#C9D1D9">PostgreSQL · MongoDB · Redis · BullMQ · Prisma · Supabase</text>
    <text x="786" y="328" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#21262D">03</text>
  </g>

  <!-- layer 4 : infra -->
  <g>
    <rect x="70" y="394" width="740" height="76" rx="12" fill="#161B22" stroke="#30363D"/>
    <rect x="70" y="394" width="5" height="76" rx="2.5" fill="#F0883E"/>
    <text x="96" y="424" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#F0883E">INFRA — SELF-HOSTED VPS</text>
    <text x="96" y="450" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#C9D1D9">Ubuntu · Docker · Nginx · CI/CD · PM2 · SSL · monitoring</text>
    <g transform="translate(742, 412)">
      <rect x="0" y="0" width="44" height="12" rx="3" fill="#0D1117" stroke="#F0883E" stroke-width="1.2"/>
      <rect x="0" y="16" width="44" height="12" rx="3" fill="#0D1117" stroke="#F0883E" stroke-width="1.2"/>
      <rect x="0" y="32" width="44" height="12" rx="3" fill="#0D1117" stroke="#F0883E" stroke-width="1.2"/>
      <circle cx="37" cy="6" r="2" fill="#3FB950"><animate attributeName="opacity" values="1;0.15;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="37" cy="22" r="2" fill="#3FB950"><animate attributeName="opacity" values="1;0.15;1" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="37" cy="38" r="2" fill="#3FB950"><animate attributeName="opacity" values="1;0.15;1" dur="1.8s" begin="1.2s" repeatCount="indefinite"/></circle>
    </g>
  </g>
</svg>
