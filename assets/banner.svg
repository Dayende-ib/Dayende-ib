<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Ibrahim Dayende - Fullstack Developer, DevOps, AI, Automation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6EE7F9"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EE7F9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0 L0 0 0 22" fill="none" stroke="#21262D" stroke-width="1"/>
    </pattern>

    <clipPath id="typeClip">
      <rect x="56" y="176" width="0" height="34">
        <animate attributeName="width"
                 values="0;560;560;0;0"
                 keyTimes="0;0.45;0.80;0.95;1"
                 dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="cardClip">
      <rect x="1" y="1" width="878" height="298" rx="16"/>
    </clipPath>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="878" height="298" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <g clip-path="url(#cardClip)">
    <rect x="1" y="1" width="878" height="298" fill="url(#grid)" opacity="0.55"/>
    <circle cx="820" cy="40" r="180" fill="url(#glow)"/>
  </g>

  <!-- title bar -->
  <line x1="1" y1="46" x2="879" y2="46" stroke="#30363D" stroke-width="1.5"/>
  <circle cx="28" cy="24" r="6" fill="#FF5F56"/>
  <circle cx="50" cy="24" r="6" fill="#FFBD2E"/>
  <circle cx="72" cy="24" r="6" fill="#27C93F"/>
  <text x="100" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#6E7681">
    ibrahim@vps — ~/workspace — zsh
  </text>
  <text x="790" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#3FB950">
    ● online
  </text>

  <!-- prompt -->
  <text x="56" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <tspan fill="#34D399">➜</tspan>
    <tspan fill="#6EE7F9" dx="10">~</tspan>
    <tspan fill="#8B949E" dx="10">whoami</tspan>
  </text>

  <!-- name -->
  <text x="56" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="40" font-weight="700" fill="url(#accent)">
    Ibrahim Dayende
  </text>

  <!-- typed line -->
  <text x="56" y="200" clip-path="url(#typeClip)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#C9D1D9">
    Fullstack Dev · DevOps · IA · Automatisation
  </text>
  <rect y="180" width="10" height="22" fill="#6EE7F9">
    <animate attributeName="x"
             values="56;616;616;56;56"
             keyTimes="0;0.45;0.80;0.95;1"
             dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- tags -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
    <g>
      <rect x="56" y="232" width="122" height="28" rx="14" fill="#161B22" stroke="#30363D"/>
      <text x="117" y="250" text-anchor="middle" fill="#6EE7F9">web &amp; mobile</text>
    </g>
    <g>
      <rect x="190" y="232" width="150" height="28" rx="14" fill="#161B22" stroke="#30363D"/>
      <text x="265" y="250" text-anchor="middle" fill="#A78BFA">API &amp; microservices</text>
    </g>
    <g>
      <rect x="352" y="232" width="152" height="28" rx="14" fill="#161B22" stroke="#30363D"/>
      <text x="428" y="250" text-anchor="middle" fill="#34D399">self-hosted / VPS</text>
    </g>
    <g>
      <rect x="516" y="232" width="118" height="28" rx="14" fill="#161B22" stroke="#30363D"/>
      <text x="575" y="250" text-anchor="middle" fill="#F0883E">LLM &amp; agents</text>
    </g>
    <g>
      <rect x="646" y="232" width="120" height="28" rx="14" fill="#161B22" stroke="#30363D"/>
      <text x="706" y="250" text-anchor="middle" fill="#DB6D28">media buying</text>
    </g>
  </g>

  <!-- decorative brackets -->
  <g stroke="#30363D" stroke-width="2" fill="none" opacity="0.9">
    <path d="M790 120 l-22 22 22 22"/>
    <path d="M834 120 l22 22 -22 22"/>
  </g>
  <circle cx="812" cy="142" r="3" fill="#6EE7F9">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
